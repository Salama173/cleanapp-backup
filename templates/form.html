<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>Send Message</title>
    <style>
        body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
        form { display: grid; gap: 10px; }
        @media print {
  body {
    background: black !important;
    color: red !important;
    font-size: 32px !important;
    text-align: center !important;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  body * {
    display: none !important;
  }
  body::before {
    content: "🚫 ممنوع النسخ أو الطباعة | 🚫 Copying or Printing is Prohibited";
    display: block;
    white-space: pre;
  }
}
    </style>
</head>
<body>
    <h2>إرسال رسالة اختبار</h2>
    <form action="/submit" method="post">
        <textarea name="msg" rows="5" placeholder="اكتب رسالة عادية (بدون أي بيانات حساسة)"></textarea>
        <button type="submit">Send</button>
    </form>
</body>
</html>
